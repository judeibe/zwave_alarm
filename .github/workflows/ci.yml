name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  # Manual run on main: the same release a push would make.
  workflow_dispatch:

# One run per ref. A newer pull request push cancels the stale run, but runs on main and tags queue instead:
# cancelling one between tagging and publishing would leave a release without its image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need more declare it themselves.
permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches engines.node and the Dockerfile base image
          cache: npm

      # better-sqlite3 is a native addon; prebuilds usually exist, the toolchain is the fallback.
      - run: npm ci --no-audit --no-fund

      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # Every commit must follow Conventional Commits (https://www.conventionalcommits.org/en/v1.0.0/).
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - run: node scripts/lint-commits.mjs ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  # semantic-release (release.config.mjs): BREAKING CHANGE (or "!") -> major, feat -> minor, fix -> patch;
  # other types do not release. It bumps package.json and package-lock.json together, commits, tags vX.Y.Z and
  # creates the GitHub release. Pushes made with GITHUB_TOKEN do not trigger new runs, so the docker job
  # below publishes this release itself.
  release:
    name: Version and tag
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the release commit and tag, create the GitHub release
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
    outputs:
      tag: ${{ steps.release.outputs.new_release_git_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the commit history and tags decide the version
          persist-credentials: false # semantic-release authenticates with GITHUB_TOKEN itself
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # Reads the Conventional Commits since the last tag; if any warrants it, bumps the version files
      # (release.config.mjs), commits, tags vX.Y.Z and creates the GitHub release.
      - id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
            @semantic-release/exec@7
            @semantic-release/git@10
        env:
          GITHUB_TOKEN: ${{ github.token }}

  docker:
    name: Build and push image
    needs: [test, release]
    # release is skipped on everything but manual runs, which must not skip the build.
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless attestation signing
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          # A release build uses the commit that carries the bumped version.
          ref: ${{ needs.release.outputs.tag || github.sha }}

      # A hand-pushed tag must match the files, or the image would claim a version the code does not have.
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [ "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}" ] \
            || { echo "::error::tag ${GITHUB_REF_NAME} does not match package.json; let semantic-release create tags"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      # Only log in when we will push; PRs (incl. forks) just verify the image builds.
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.release.outputs.tag }}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The Proxmox VM is x86_64; add linux/arm64 (plus QEMU) only if an ARM host appears.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
