version: 2

# Commit messages and PR titles read "chore(deps): bump ...", so they pass the Conventional Commits check
# and do not trigger a release (only fix, feat and breaking changes do).
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: pip
    directory: /ha-integration
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
