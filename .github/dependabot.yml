version: 2

# One combined PR per week across every ecosystem. Commit messages and PR titles read
# "chore(deps): bump ...", so they pass the Conventional Commits check and do not trigger a release
# (only fix, feat and breaking changes do).
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # typescript-eslint (latest 8.72.0, canary included) peers on typescript <6.1.0, so TS 7
      # fails `npm ci` with ERESOLVE. Remove once typescript-eslint publishes TS 7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
