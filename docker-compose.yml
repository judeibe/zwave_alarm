services:
  zwave-alarm:
    build: .
    image: zwave-alarm-ha-integration
    container_name: zwave-alarm
    restart: unless-stopped
    # Pass the Z-Wave USB controller through to the container. This process must be
    # the sole owner of the serial port (FR-005) - point SERIAL_PORT at the same
    # in-container path below.
    devices:
      - "/dev/serial/by-id/your-controller:/dev/zwave"
    ports:
      # REST/WS API (HTTP_PORT)
      - "3000:3000"
      # zwave-js-server WebSocket protocol, consumed directly by Home Assistant's
      # built-in "Z-Wave JS" integration (ZWAVE_SERVER_PORT)
      - "3001:3001"
    env_file:
      - .env
    environment:
      SERIAL_PORT: /dev/zwave
      DB_PATH: /app/data/alarm.db
    volumes:
      - zwave-alarm-data:/app/data

volumes:
  zwave-alarm-data:
