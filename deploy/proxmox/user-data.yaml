#cloud-config
# Proxmox "snippets" cloud-init user-data for the zwave-alarm VM (Ubuntu Server + Docker).
# Replace <YOUR_SSH_PUBLIC_KEY> before copying to <snippets-storage>:snippets/. Safe to re-run:
# the .env (and its generated secret) is only created when missing.
hostname: zwave-alarm
manage_etc_hosts: true
package_update: true
users:
  - name: ubuntu
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - <YOUR_SSH_PUBLIC_KEY>
# linux-generic ships the cdc_acm driver the Z-Wave stick needs; the cloud/kvm kernel does not.
packages: [qemu-guest-agent, ca-certificates, curl, linux-generic]
write_files:
  - path: /opt/zwave-alarm/docker-compose.yml
    content: |
      services:
        zwave-alarm:
          image: ghcr.io/judeibe/zwave_alarm:main
          container_name: zwave-alarm
          restart: unless-stopped
          healthcheck:
            # Liveness only: /healthz stays 200 while the Z-Wave driver is down. The driver's own state is
            # `driver` on GET /api/v1/panel.
            test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.HTTP_PORT || 3000) + '/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
            interval: 30s
            timeout: 5s
            start_period: 30s
            retries: 3
          devices:
            - "/dev/serial/by-id/__ZWAVE_BY_ID__:/dev/zwave"
          ports: ["3000:3000", "3001:3001"]
          env_file: .env
          environment:
            SERIAL_PORT: /dev/zwave
            DB_PATH: /app/data/alarm.db
          volumes: [zwave-alarm-data:/app/data]
      volumes:
        zwave-alarm-data:
runcmd:
  - systemctl enable --now qemu-guest-agent
  - command -v docker >/dev/null || curl -fsSL https://get.docker.com | sh
  - systemctl enable --now docker
  - |
    cd /opt/zwave-alarm
    if [ ! -f .env ]; then
      umask 077
      printf 'SESSION_SECRET=%s\nHTTP_PORT=3000\nZWAVE_SERVER_PORT=3001\n' "$(openssl rand -hex 32)" > .env
    fi
  # The stick appears after the kernel module loads (needs a reboot the first time); pick the first by-id device.
  - |
    dev=$(ls /dev/serial/by-id/ 2>/dev/null | head -n1)
    if [ -n "$dev" ]; then
      sed -i "s#__ZWAVE_BY_ID__#$dev#" /opt/zwave-alarm/docker-compose.yml
      cd /opt/zwave-alarm && docker compose up -d
    else
      # Without this the placeholder stays in docker-compose.yml and nothing starts, with no sign why.
      msg="zwave-alarm is NOT running: no Z-Wave stick under /dev/serial/by-id/. Attach it to the VM, reboot if cdc_acm is missing, then replace __ZWAVE_BY_ID__ in /opt/zwave-alarm/docker-compose.yml with its by-id name and run: cd /opt/zwave-alarm && docker compose up -d"
      echo "$msg" | tee -a /etc/motd /var/log/zwave-alarm-setup.log
    fi
power_state:
  mode: reboot
  condition: test ! -e /lib/modules/$(uname -r)/kernel/drivers/usb/class/cdc-acm.ko
